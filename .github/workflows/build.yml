name: Valintaperusteet-service

# Empty in main. Set to a ticket id (e.g. "OY-1234") on a dev branch
# to deploy under version <base-version>-<TICKET>-SNAPSHOT.
# MUST be empty before merging to main.
env:
  DEV_BRANCH_DEPLOY: ''

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - uses: szenius/set-timezone@dd47655c84241eec2ffa0a855959c16c0920c3c4
        with:
          timezoneLinux: "Europe/Helsinki"

      - name: Build with Maven
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn clean spotless:check package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=opetushallitus -Dsonar.projectKey=Opetushallitus_valintaperusteet -B -Dbranch=${GITHUB_REF_NAME} -Drevision=${GITHUB_SHA} -DbuildNumber=${GITHUB_RUN_NUMBER} --settings settings.xml

      - uses: actions/cache@v4
        id: restore-build
        with:
          path: |
            target
            valintaperusteet-api/target
            valintaperusteet-domain/target
            valintaperusteet-laskenta/target
            valintaperusteet-service/target
            ovara-valintaperusteet/target
          key: ${{ github.sha }}

  deploy-container:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: restore-build
        with:
          path: |
            target
            valintaperusteet-api/target
            valintaperusteet-domain/target
            valintaperusteet-laskenta/target
            valintaperusteet-service/target
            ovara-valintaperusteet/target
          key: ${{ github.sha }}

      - name: Build and deploy Docker container
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh

          export ARTIFACT_NAME="valintaperusteet-service"
          mv valintaperusteet-service/target/valintaperusteet-service-exec.jar $DOCKER_BUILD_DIR/artifact/${ARTIFACT_NAME}.jar
          cp -vr src/main/resources/oph-configuration $DOCKER_BUILD_DIR/config/
          export BASE_IMAGE="baseimage-fatjar-openjdk21:master"
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $ARTIFACT_NAME
          ./ci-tools/github-build/upload-image.sh $ARTIFACT_NAME

          ./ci-tools/common/clean-docker-build-dir.sh

          export ARTIFACT_NAME="ovara-valintaperusteet"
          mv ovara-valintaperusteet/target/ovara-valintaperusteet.jar $DOCKER_BUILD_DIR/artifact/${ARTIFACT_NAME}.jar
          cp -vr ovara-valintaperusteet/src/main/resources/oph-configuration $DOCKER_BUILD_DIR/config/
          export BASE_IMAGE="baseimage-fatjar-openjdk21:master"
          ./ci-tools/common/pull-image.sh
          ./ci-tools/github-build/build-fatjar.sh $ARTIFACT_NAME
          ./ci-tools/github-build/upload-image.sh $ARTIFACT_NAME

  deploy-jar-library:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Refuse dev-only configuration on main
        if: env.DEV_BRANCH_DEPLOY != '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::DEV_BRANCH_DEPLOY is set to '${DEV_BRANCH_DEPLOY}' on main. Clear it before merging."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: restore-build
        with:
          path: |
            target
            valintaperusteet-api/target
            valintaperusteet-domain/target
            valintaperusteet-laskenta/target
            valintaperusteet-service/target
            ovara-valintaperusteet/target
          key: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Rewrite artifact version with ticket id
        if: success() && env.DEV_BRANCH_DEPLOY != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT=$(mvn -q --settings settings.xml -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          NEW="${CURRENT%-SNAPSHOT}-${DEV_BRANCH_DEPLOY}-SNAPSHOT"
          echo "Rewriting artefact version: $CURRENT -> $NEW"
          mvn -B --settings settings.xml versions:set -DnewVersion="$NEW" -DgenerateBackupPoms=false -DprocessAllModules=true -DupdateMatchingVersions=true

      - name: Deploy jar library
        if: success() && (env.DEV_BRANCH_DEPLOY != '' || format('refs/heads/{0}', github.event.repository.default_branch) == github.ref)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com/Opetushallitus/ci-tools.git
          source ci-tools/common/setup-tools.sh
          mvn deploy -B -pl fi.vm.sade.valintaperusteet:valintaperusteet,valintaperusteet-domain,valintaperusteet-api,valintaperusteet-laskenta -DskipTests --settings settings.xml
